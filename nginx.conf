# SPA fallback: serve index.html for any path that has no file
# (react-router client-side routing needs this)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets — cache long
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
